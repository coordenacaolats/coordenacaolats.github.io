# Atualiza as notícias do STF/STJ duas vezes por dia e publica o site no GitHub Pages.
# Também publica a cada alteração enviada para a branch main. Quando uma edição do
# Informativo é aprovada, junta o comentário do membro e envia o e-mail aos inscritos.
name: Atualizar e publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9,21 * * *"   # 06h e 18h (horário de Brasília)
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
      BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
      BREVO_SENDER_NAME: ${{ vars.BREVO_SENDER_NAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar SDK da Anthropic (só se houver chave)
        if: github.event_name != 'push' && env.ANTHROPIC_API_KEY != ''
        run: pip install anthropic
      - name: Coletar notícias do STF e do STJ
        if: github.event_name != 'push'
        run: python scripts/atualizar_tribunais.py
      - name: Informativo — comentário do membro e e-mail aos inscritos
        run: python scripts/informativo_email.py
      - name: Salvar alterações
        run: |
          git config user.name "LATS bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/tribunais.js site/data/informativos.js informativo/comentario-da-semana.md
          git diff --cached --quiet || (git commit -m "Atualiza notícias e Informativo" && git pull --rebase && git push)

  publicar:
    needs: atualizar
    if: always() && needs.atualizar.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # O pacote às vezes demora alguns segundos para aparecer na lista do GitHub
      - name: Aguardar o pacote do site ficar disponível
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 24); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" -q .total_count || echo 0)
            if [ "${n:-0}" -gt 0 ]; then echo "Pacote disponível (tentativa $i)"; sleep 5; exit 0; fi
            sleep 5
          done
          echo "O pacote não apareceu na lista"; exit 1
      - id: deploy
        uses: actions/deploy-pages@v4
