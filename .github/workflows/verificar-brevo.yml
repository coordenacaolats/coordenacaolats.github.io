# Execução manual: confere a chave da Brevo. Não envia e-mail.
name: Verificar a Brevo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/informativo_email.py --verificar
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
